<script>
/* SOURCE CONTENT AND CHAPTERS */
const CHAPTERS = [
  {id:'pristav',num:'01',name:'Prístav prvých rozhodnutí',short:'Zoznám sa s dopytom',icon:'⛵',place:'Prístav a promenáda',minutes:9,accent:'#4CBFA5',unlock:'Turistický prístav',learn:['individuálny, trhový a agregátny dopyt','C + I + G + NX','čo vplýva na C, I, G a NX'],steps:[
    {type:'story',title:'Ráno v Turistánii',avatar:'👩‍💼',speaker:'Starostka Ela',lines:['Vitajte, manažérsky tím! Turistánia žije z hotelov, reštaurácií a návštevníkov. Počasie je krásne, no hospodárstvo potrebuje dobré rozhodnutia.','V tejto hre nebudete tipovať definície. Budete skúmať, prečo ľudia míňajú peniaze, prečo firmy investujú a čo sa stane, keď sa podmienky zmenia.'],fact:'Dopyt = záujem a schopnosť nakupovať. Celkový dopyt krajiny nazývame agregátny dopyt (AD).'},
    {type:'sort',title:'Kto vlastne nakupuje?',lead:'Otvorte príjmové účtenky Turistánie. Každý výdavok patrí do jednej zo štyroch častí AD.',tags:['C • domácnosti','I • investície','G • vláda','NX • čistý export'],items:[
      {text:'Slovenská rodina si zaplatila víkend v hoteli.',answer:0,why:'C – domácnosť kupuje službu na vlastnú spotrebu.'},
      {text:'Hotel kúpil nové profesionálne práčky.',answer:1,why:'I – nový kapitálový majetok slúži ďalšej prevádzke.'},
      {text:'Mesto objednalo opravu turistického chodníka.',answer:2,why:'G – ide o nákup verejnej správy.'},
      {text:'Nemeckí hostia zaplatili pobyt na Slovensku.',answer:3,why:'Je to vývoz slovenskej služby – vstupuje do NX cez X.'},
      {text:'Slovenský hotel objednal uteráky z Turecka.',answer:3,why:'Je to dovoz (M) – v čistom exporte má záporné znamienko.'},
      {text:'Štát vyplatil dôchodok bývalej hotelierke.',answer:-1,why:'Transferová platba NIE JE priamy nákup výrobkov alebo služieb štátu (G).',special:'Mimo G'}
    ],tip:'Transfer ≠ G. Zahraničný turista v slovenskom hoteli = vývoz služby.'},
    {type:'choice',title:'Jedna izba, celé mesto, celá krajina',case:'Jedna študentka chce kúpiť noc v hoteli. Všetci hostia v Trenčíne chcú ubytovanie. A nakoniec všetky domácnosti, firmy, štát a zahraničie míňajú v ekonomike.',q:'Ktorý pojem opisuje POSLEDNÚ situáciu?',options:['Individuálny dopyt','Trhový dopyt po ubytovaní','Agregátny dopyt celej ekonomiky'],correct:2,why:'AD nehovorí iba o jednom hosťovi ani o jednej hotelovej službe, ale o celkových plánovaných výdavkoch na domáci produkt.',memory:'Jedna osoba → individuálny. Jeden trh → trhový. Celá ekonomika → agregátny.'},
    {type:'sort',title:'Čo zmení výdavky?',lead:'Na recepcii pristávajú štyri správy. Určite, ktorú časť AD ovplyvnia najpriamejšie.',tags:['C','I','G','NX'],items:[
      {text:'Rodiny sa obávajú prepúšťania a šetria na dovolenke.',answer:0,why:'Strach z budúcnosti znižuje ochotu domácností spotrebúvať.'},
      {text:'Úrokové sadzby rastú a hotel odkladá stavbu wellness.',answer:1,why:'Drahší úver môže obmedziť firemné investície.'},
      {text:'Obec zaplatí vybudovanie cyklotrasy.',answer:2,why:'Priamy nákup verejnej správy zvyšuje G.'},
      {text:'Pribudnú hostia, ktorí pricestovali zo zahraničia.',answer:3,why:'Vývoz služieb cestovného ruchu rastie; ak sa ostatné nemení, NX môže rásť.'}
    ],tip:'Zložka AD hovorí, KTO míňa – nie o tom, či je nákup dobrý alebo zlý.'},
    {type:'choice',title:'Záhada pokladnice',case:'Hotel má voľné izby. Ľudia majú menej peňazí po zaplatení daní. Zrušia časť rezervácií.',q:'Ktorý faktor spotreby domácností je v tomto príbehu kľúčový?',options:['Disponibilný príjem po zdanení','Počet hotelových poschodí','Výrobná kapacita ekonomiky'],correct:0,why:'Spotrebu domácností ovplyvňuje najmä disponibilný príjem a cenová hladina, ale aj majetok, preferencie a očakávania.',memory:'C = peniaze ľudí + ceny + ich očakávania.'}
  ]},
  {id:'hotel',num:'02',name:'Záhada rezervácií',short:'Objav krivku AD',icon:'🏨',place:'Hotel Panorama',minutes:9,accent:'#E6AC5D',unlock:'Hotel Panorama',learn:['osi P a Y, klesajúca AD','pohyb po krivke vs. posun celej krivky','rozpočtová a menová politika'],steps:[
    {type:'story',title:'Najprv jeden graf, až potom posun',avatar:'🧑‍🔬',speaker:'Analytik Samo',lines:['Na zvislej osi je P – priemerná cenová hladina. Na vodorovnej osi Y – reálny produkt/HDP.','AD klesá: pri vyššej celkovej cenovej hladine sa spravidla dopytuje menšie množstvo domácej reálnej produkcie. Pri jednej hotelovej izbe ide o podobnú intuíciu, ale AD je krivka CELEJ ekonomiky.'],fact:'Na grafe AD: P je hore a dole, Y je vľavo a vpravo. AD sa skláňa zľava hore doprava dole.',graph:'ad-only'},
    {type:'choice',title:'Dva druhy zmeny',case:'Zdražie celková cenová hladina. Dane, úroky aj ostatné okolnosti sa nemenia.',q:'Čo znázorníme?',options:['Pohyb po tej istej krivke AD','Posun celej krivky AD doprava','Posun celej krivky AS'],correct:0,why:'Mení sa P na osi, preto sa pohybujeme po jednej AD. Celú AD posúvame, ak sa zmení iný determinant, napríklad dane, úroky či očakávania.',memory:'Zmena P → PO krivke AD. Iný dôvod → POSUN AD.'},
    {type:'shift',title:'Graf naživo: prílev turistov',case:'Do krajiny prichádza viac zahraničných turistov a viac míňajú na slovenské služby. Pri danej cenovej hladine rastú celkové plánované výdavky.',target:1,axis:'AD',options:['◀ Doľava','Bez zmeny','Doprava ▶'],why:'Rast vývozu služieb môže zvýšiť NX a posunúť AD doprava. Ak by zahraniční hostia míňali menej, AD by sa posunula doľava.',memory:'Viac AD = doprava. Menej AD = doľava.'},

      ['Pri poklese AD doplníme…',['zvýšenie P','AD₂ pod a naľavo od AD','zvislú AS'],1,'Pri poklese agregátneho dopytu sa AD posúva doľava/dole.']

    {type:'choice',title:'Dve mocné páky',case:'Mesto objedná novú turistickú cestu. Centrálna banka zas zvýši úrokové sadzby a hotel odloží investíciu.',q:'Ktorá dvojica politík je správne priradená?',options:['Cesta = menová; úroky = rozpočtová','Cesta = rozpočtová; úroky = menová','Oboje je ponukový šok'],correct:1,why:'G (priame vládne nákupy) patrí do rozpočtovej politiky. Úrokové sadzby sú nástrojom menovej politiky; drahší úver môže znížiť I.',memory:'Dane + G = rozpočtová politika. Úroky = menová politika.'},
    {type:'choice',title:'Citlivá dovolenka',case:'Keď celková cenová hladina mierne vzrastie, reálny dopyt po domácich produktoch silno zareaguje.',q:'Ako vyzerá citlivejšia krivka AD v grafe P–Y?',options:['Plochšia','Strmšia','Vždy zvislá'],correct:0,why:'Na plochejšej krivke je aj relatívne malá zmena P spojená s väčšou zmenou Y. Je to grafická ilustrácia vyššej citlivosti.',memory:'Plochšia AD = väčšia zmena Y pri menšej zmene P.'}
  ]},
  {id:'kuchyna',num:'03',name:'Kuchyňa pod tlakom',short:'Preskúmaj agregátnu ponuku',icon:'🍲',place:'Reštaurácia Laguna',minutes:12,accent:'#EA826B',unlock:'Reštaurácia Laguna',learn:['AS a jej determinanty','klasická, keynesovská, monetaristická AS','nominálna a reálna mzda','neokeynesovské krátke vs. dlhé obdobie'],steps:[

    {type:'sort',title:'Ponuku preveríme v sklade',lead:'Pri každej situácii rozhodnite, či je priaznivá (+) alebo nepriaznivá (−) pre možnosti výroby a náklady. Ostatné okolnosti nemeníme.',tags:['AS podporí','AS oslabí'],items:[

      {text:'Dovozné suroviny prudko zdražejú.',answer:1,why:'Drahšie vstupy zvyšujú náklady výrobcov.'},
      {text:'Firmy zavádzajú lepšie postupy a menej plytvajú.',answer:0,why:'Vyššia produktivita umožňuje väčšiu alebo lacnejšiu produkciu.'}
    ],tip:'AS sa týka schopnosti vyrábať, nie toho, koľko chcú hostia kúpiť.'},
    {type:'choice',title:'Výplata nie je kúpna sila',case:'Recepčnému nezmenili výplatu 1 000 € mesačne, ale nájom a potraviny zdraželi.',q:'Čo sa stalo s reálnou mzdou?',options:['Zvýšila sa','Znížila sa','Zostala určite rovnaká'],correct:1,why:'Nominálna mzda je suma na výplatnej páske. Reálna mzda ukazuje, čo si za ňu vieme kúpiť – pri rastúcich cenách jej kúpna sila klesá.',memory:'Nominálna = suma v €. Reálna = kúpna sila.'},
    {type:'graph',graph:'asclassic',title:'Výkres 2a: klasická AS',case:'Predstavte si krajinu na potenciálnej úrovni produkcie Y*: ceny a mzdy sa prispôsobujú.',build:[
      ['Kde je AS v klasickom modeli?',['Klesá','Zvislá na Y*','Vodorovná'],1,'Pri tomto pohľade je dlhodobý výstup daný výrobnými možnosťami.'],

    {type:'choice',title:'Štyri pohľady, jeden hotel',case:'Hotel má ešte rezervné izby, ale po rokoch musí investovať do budov, kvalifikácie a vybavenia. Neokeynesovci zdôrazňujú rozdiel krátkeho a dlhého obdobia.',q:'Ktorá veta vystihuje základnú myšlienku z opory?',options:['AS musí byť vždy klesajúca','Krátkodobá a dlhodobá časť AS sa môžu líšiť','Všetky ceny musia byť stále'],correct:1,why:'Neokeynesovstvo spája krátkodobé keynesovské a dlhodobé klasické úvahy. V opore sa hovorí o keynesovskom a klasickom poli.',memory:'Krátko môžu byť zdroje nevyužité; dlho rozhoduje výrobná kapacita.'}

      ['Čo označí bod E?',['Iba AD','Pₑ aj Yₑ','Mzdu pracovníka'],1,'Z bodu E čítame rovnovážnu cenu a rovnovážny produkt.']

    {type:'graph',graph:'eqmonet',title:'Výkres 7: monetaristi na radnici',case:'Krátkodobá aj dlhodobá ponuka sa stretajú s AD v jednom referenčnom bode.',build:[

  {id:'letisko',num:'05',name:'Veľký turistický boom',short:'Čo spraví rast AD?',icon:'✈️',place:'Letisko Horizont',minutes:9,accent:'#5CA7E4',unlock:'Letisko Horizont',learn:['rast AD v klasickom a Keynesovom modeli','krátkodobá a dlhodobá monetaristická reakcia','dopytový šok'],steps:[

    {type:'graph',graph:'growthclassic',title:'Výkres 8a: boom podľa klasikov',case:'Predstav si, že ekonomika už pracuje na svojej potenciálnej kapacite Y*.',build:[

    {type:'choice',title:'Príbeh jedného hotela',case:'Letisko privádza viac hostí. Hotel má časť izieb prázdnych a môže prijať sezónnych pracovníkov.',q:'Ktorý pohľad najlepšie vysvetľuje krátkodobý rast obsadenosti aj zamestnanosti?',options:['Keynesov model s nevyužitými kapacitami','Klasický model so zvislou AS','Žiadna ekonomická teória'],correct:0,why:'V krátkom období s voľnými zdrojmi môže rast dopytu zvýšiť skutočnú produkciu a zamestnanosť. Nie je to však záruka pri každom hoteli ani každom šoku.',memory:'Viac hostí + voľné zdroje → podnik môže obslúžiť viac hostí.'}

    {type:'sort',title:'Roztrieď krízové správy',lead:'Aký je HLAVNÝ priamy účinok zmeny? Ak sa mení viac vecí, vyberte „Obe“.',tags:['AD','AS','Obe'],items:[

      {text:'Firmám prudko zdražie elektrina.',answer:1,why:'Menia sa náklady výroby (AS).'},

function graphSchematic(id,stepCount=0){
 const maxStage=Math.max(0,stepCount); const axis=`<path d="M65 27V304H645" fill="none" stroke="#1a354d" stroke-width="5" stroke-linecap="round"/><path d="M65 20l-8 17h16z M652 304l-17-8v16z" fill="#1a354d"/><text x="48" y="29" font-size="25" font-weight="900" fill="#1a354d">P</text><text x="647" y="335" font-size="25" font-weight="900" fill="#1a354d">Y</text>`;
 let v='',parts=[];
 const ad=(c,l,shift=0)=>`<g><path d="M${182+shift} ${66-shift*.34} C${215+shift} ${152-shift*.3} ${329+shift} ${218-shift*.15} ${537+shift} ${231-shift*.1}" stroke="#d99151" stroke-width="5" fill="none"/><text x="${551+shift}" y="${236-shift*.1}" font-size="23" font-weight="800" fill="#b47834">${l}</text></g>`;
 const as=(l,shift=0)=>`<g><path d="M${187+shift} ${273-shift*.06} L${527+shift} ${84-shift*.06}" stroke="#159987" stroke-width="5" fill="none"/><text x="${534+shift}" y="${86-shift*.06}" font-size="22" font-weight="800" fill="#0e8877">${l}</text></g>`;
 const vert=(l,x=370)=>`<g><path d="M${x} 48V303" stroke="#159987" stroke-width="5"/><text x="${x+13}" y="60" font-size="21" font-weight="900" fill="#108b77">${l}</text><text x="${x-11}" y="335" font-size="21" font-weight="900" fill="#108b77">Y*</text></g>`;
 const dot=(x=370,y=175,l='E')=>`<circle cx="${x}" cy="${y}" r="7" fill="#203c56"/><text x="${x+10}" y="${y-12}" font-size="21" font-weight="900" fill="#203c56">${l}</text><path d="M65 ${y}H${x}V304" stroke="#9badbb" stroke-width="2.5" stroke-dasharray="8 8" fill="none"/>`;
 switch(id){
  case 'ad-only':parts=[ad('AD')];break;
  case 'adshift':parts=[ad('AD'),ad('AD₁',73),ad('AD₂',-56)];break;
  case 'asclassic':parts=[vert('AS')];break;
  case 'askeynes':parts=[as('AS')];break;
  case 'asmonet':parts=[as('ASᴷ'),vert('ASᴰ')];break;
  case 'eqclassic':parts=[ad('AD'),vert('AS'),dot()];break;
  case 'eqkeynes':parts=[ad('AD'),as('AS'),dot(350,188)];break;
  case 'eqmonet':parts=[ad('AD'),as('ASᴷ'),vert('ASᴰ'),dot()];break;
  case 'growthclassic':parts=[ad('AD₀'),vert('AS'),ad('AD₁',74),dot(370,175,'E₁')];break;
  case 'growthkeynes':parts=[ad('AD₀'),as('AS'),ad('AD₁',73),dot(408,155,'E₁')];break;
  case 'growthmonet':parts=[ad('AD₀'),as('ASᴷ₀'),vert('ASᴰ'),ad('AD₁',75),as('ASᴷ₁',-55),dot(370,100,'E₂')];break;
  case 'tax':parts=[ad('AD'),as('AS'),ad('AD₁',-53),as('AS₁',-57)];break;
  case 'wage':parts=[ad('AD'),as('AS'),as('AS₁',-48),ad('AD₁',64)];break;
 }
 // progressively add curve components as answers are solved, but keep axes visible from the start.
 const display=parts.slice(0,id==='ad-only'?1:Math.min(parts.length,maxStage));
 return `<div class="graph-canvas"><svg viewBox="0 0 700 355" role="img" aria-label="Rozpracovaný ekonomický graf s označenými osami P a Y">${axis}${display.join('')} ${maxStage===0?'<text x="365" y="160" text-anchor="middle" fill="#bbcbd4" font-size="21" font-weight="900">TU ZOSTAVÍTE GRAF</text>':''}</svg></div>`;
}
function shiftSvg(delta,axis){const x=delta*49,y=-delta*32;const col=axis==='AS'?'#0b9b86':'#d98e50';return `<div class="graph-canvas"><svg viewBox="0 0 700 355" role="img" aria-label="Interaktívny graf posunu krivky"><defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#253d57"/></marker></defs><path d="M65 23V305H645" stroke="#203b55" stroke-width="5" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="42" y="38" font-size="25" fill="#1b3950" font-weight="900">P</text><text x="644" y="336" font-size="25" fill="#1b3950" font-weight="900">Y</text><path d="M170 66Q220 202 560 248" stroke="#b4bfca" stroke-width="5" stroke-dasharray="12 10" fill="none"/><text x="567" y="249" font-size="19" fill="#6e8490">AD₀</text><path d="M${170+x} ${66+y}Q${220+x} ${202+y} ${560+x} ${248+y}" stroke="${col}" stroke-width="6" fill="none" style="transition:all .32s ease"/><text x="${567+x}" y="${246+y}" font-size="23" fill="${col}" font-weight="900">AD₁</text><text x="385" y="36" font-size="14" fill="#597184">${delta===-1?'CELKOVÝ DOPYT KLESÁ':delta===1?'CELKOVÝ DOPYT RASTIE':'ZATIAĽ BEZ POSUNU'}</text></svg></div>`}

function welcome(){return `<section class="hero"><div class="intro"><div class="eyebrow">Interaktívna 2D strategická hra · bez internetu</div><h2 class="title">Tvoja krajina.<br>Tvoj tím.<br><span>Tvoje rozhodnutia.</span></h2><p class="subtitle">Prevezmite turistickú krajinu Turistánia. Riešte reálne ekonomické dilemy, objavujte krivky AD a AS a zachráňte sezónu. <strong>Bez počítania. Bez zbytočného memorovania.</strong></p><div class="tagrow"><span class="tag">👥 Tím 2–3 ľudia</span><span class="tag">⏱️ 60–70 minút</span><span class="tag">🏙️ 7 misií</span><span class="tag">📈 12 grafov</span></div><div class="field"><label for="team-input">Ako sa volá váš manažérsky tím?</label><input id="team-input" maxlength="40" placeholder="Napr. Turistické legendy" autocomplete="off" value="${esc(state.team)}"></div><button class="btn btn-primary" data-action="start">▶ VSTÚPIŤ DO TURISTÁNIE</button><p class="muted">Hra funguje offline v prehliadači. Výsledky nikam neposiela; priebeh si môže zapamätať len vo vašom prehliadači.</p></div><div class="city-frame">${citySvg()}<span class="city-credit">OBJAVUJTE MESTO · RIAĎTE EKONOMIKU</span></div></section><div class="panel" style="margin-top:25px"><div class="eyebrow">Ako hra funguje</div><div class="summary-grid"><div><strong>1 · Rozhodujte</strong><p>Čítajte správy od hoteliérov, hostí a starostky. V tíme sa poraďte.</p></div><div><strong>2 · Experimentujte</strong><p>Posúvajte krivky, triedte výdavky a vysvetľujte dôsledky.</p></div><div><strong>3 · Odomykajte mesto</strong><p>Nové štvrte sa otvárajú po dokončení predchádzajúcej misie.</p></div><div><strong>4 · Vysvetľujte „prečo“</strong><p>Za chyby sa neodpočítavajú body. Dostanete nápovedu a skúsite znova.</p></div></div></div>`}
function mapHtml(){return `<div class="map-intro"><div><div class="eyebrow">Mapa sveta • ${esc(state.team)}</div><h2 class="title" style="font-size:37px;margin:6px 0 4px">Objavuj Turistániu</h2><p class="subtitle" style="margin:0">Odomykajte lokality postupne. Na každú počítajte približne 8–12 minút.</p></div><div>${state.done.length===7?'<button class="btn btn-gold btn-small" data-action="certificate">🏆 Zobraziť ocenenie</button>':''}<button class="btn btn-outline btn-small" data-action="reset-ask">↺ Začať odznova</button></div></div><div class="city-frame">${citySvg()}<span class="city-credit">Kliknite na odomknutú lokalitu alebo na kartu pod mapou</span></div><div class="chapter-list">${CHAPTERS.map((c,i)=>{let locked=i>0&&!state.done.includes(i-1),done=state.done.includes(i);let label=done?'✓ Dokončené':locked?'🔒 Zatiaľ zamknuté':'▶ Pripravené na hranie';return `<button class="district-card ${done?'done':!locked?'current':''}" data-open-chapter="${i}" ${locked?'disabled':''}><span class="emoji">${c.icon}</span><span><strong>${c.num} · ${esc(c.name)}</strong><small>${esc(c.short)} · ${c.minutes} min</small><div class="status">${label}</div></span></button>`}).join('')}</div><div class="panel" style="margin-top:20px"><strong>📌 Herné pravidlo</strong><p style="color:#687887;margin-bottom:0;font-size:14px">Nehľadáme iba správne písmeno. Pri každej situácii musia aspoň dvaja členovia tímu povedať, prečo by sa zmenil dopyt (AD), ponuka (AS) alebo výsledná rovnováha. Všetky grafy vychádzajú z vašej študijnej prezentácie.</p></div>`}
function sceneHtml(step){const ch=getChapter();let fact=step.fact||step.takeaway||step.memory||step.tip||'';let content='';if(step.graph && step.type!=='story'){content=state.activity.solvedGraph?`<figure class="graph-preview"><img alt="Riešenie grafu podľa praktika: ${esc(GRAPHS_META[step.graph].title)}" src="${GRAPH_IMAGES[step.graph]}"><figcaption>${esc(GRAPHS_META[step.graph].ref)} · kontrolný graf z prezentácie</figcaption></figure>`:graphSchematic(step.graph,state.activity.gcount||0);}
 else if(step.type==='shift'){content=shiftSvg(state.activity.shiftDelta??0,step.axis);}
 else if(step.type==='story'){content=`<div class="scene-dialog"><span class="speaker-icon">${step.avatar||'🌴'}</span><div><strong>${esc(step.speaker||'Sprievodca')}</strong>${step.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div></div>`;if(step.graph==='ad-only')content=graphSchematic('ad-only',1)+content;}
 else if(step.type==='graph'){content=state.activity.solvedGraph?`<figure class="graph-preview"><img alt="Správne riešenie ${esc(step.title)}" src="${GRAPH_IMAGES[step.graph]}"><figcaption>Porovnaj s vlastným náčrtom · ${esc(GRAPHS_META[step.graph].ref)}</figcaption></figure>`:graphSchematic(step.graph,state.activity.gcount||0);}
 else if(step.type==='policy'){content=`<div style="text-align:center;font-size:80px;padding:20px 0 5px">${ch.icon}</div><div style="font-size:14px;text-align:center;color:#627d85">Rozhodnutie tímu mení herný svet – nie oficiálne ekonomické ukazovatele.</div>${statBars()}`}
 else {content=`<div style="font-size:clamp(70px,9vw,128px);text-align:center;padding:15px 0 0">${step.type==='sort'?'🗂️':step.type==='choice'?'💡':step.type==='reflection'?'🤝':ch.icon}</div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px">${ch.learn.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`}
 return `<div class="scene-panel"><header><div class="eyebrow">${esc(ch.place)}</div><h3>${esc(step.type==='graph'?'Zostavujeme graf':'Tu sa učíme pomocou príbehu')}</h3><p class="scenesub">${esc(step.type==='graph'?GRAPHS_META[step.graph].ref:'Rozprávajte sa, skúšajte a skúmajte dôsledky.')}</p></header><div class="scene-art">${content}</div>${fact?`<div class="scene-banner"><b>💡 Zapamätaj si:</b> ${esc(fact)}</div>`:''}</div>`}
function statBars(){return `<div class="panel tight" style="margin:16px 0 0;box-shadow:none"><div class="eyebrow" style="font-size:10px">Herné ukazovatele (len ilustračné)</div>${[['tour','Turizmus'],['jobs','Práca'],['prices','Ceny']].map(([key,label])=>`<div class="statbar"><span>${label}</span><div class="stat-track"><i style="width:${state.trends[key]}%"></i></div><span class="stat-number">${state.trends[key]}</span></div>`).join('')}</div>`}
function optionButtons(options,action,selected=undefined,correct=undefined){
 // Pri triedení rozhoduje výhradne dokončenie aktuálnej karty.
 // Nevybraná odpoveď ani predchádzajúca karta nesmú možnosti deaktivovať.
 const finished=action==='sort-answer'
   ? state.activity.sortCleared===true
   : (state.activity.ready===true && Number.isInteger(selected) && Number.isInteger(correct) && selected===correct);
 return `<div class="options">${options.map((opt,i)=>{
  const label=typeof opt==='string'?opt:opt.title;
  const chosen=Number.isInteger(selected) && selected===i;
  const cls=chosen?(finished?'correct':'incorrect'):'';
  return `<button type="button" class="option ${cls}" ${finished?'disabled':''} data-action="${action}" data-val="${i}" aria-label="Možnosť ${String.fromCharCode(65+i)}: ${esc(label)}"><span class="option-letter">${String.fromCharCode(65+i)}</span>${esc(label)}</button>`;
 }).join('')}</div>`;
}

 if(st.type==='story'){inner=`<p class="task-lead">${esc(st.fact)}</p><div class="explain-strip">👥 Vysvetlite to vlastnými slovami ďalšiemu členovi tímu.</div><button class="btn btn-primary" data-action="story-done">Rozumieme · pokračovať ▶</button>`;}

 if(st.type==='sort'){const i=a.sortIndex||0;if(i<st.items.length){const item=st.items[i];inner=`<p class="task-lead">${esc(st.lead)}</p><div class="card-progress">KARTA ${i+1} Z ${st.items.length}</div>${pbar(i,st.items.length)}<div class="explain-strip" style="background:#fff0dd;font-size:17px;font-weight:900;padding:20px">📩 ${esc(item.text)}</div><p class="question" style="font-size:15px">Kam táto správa patrí?</p><p class="muted" style="margin:-10px 0 0">Vyberte jednu odpoveď A–E kliknutím na kartu.</p>${optionButtons([...st.tags,...(st.items.some(x=>x.answer===-1)?['Mimo G / transfer']:[])],'sort-answer',a.selectedSort,a.selectedSortCorrect)}`;if(a.sortCleared)inner+=`<button class="btn btn-primary" data-action="sort-next">Ďalšia karta →</button>`;}else{inner=`<div class="feedback success">✅ Všetky karty sú správne roztriedené.</div><p class="task-lead">${esc(st.tip)}</p>`;}}
 if(st.type==='shift'){inner=`<div class="explain-strip">🧳 ${esc(st.case)}</div><div class="question">Kam máš posunúť krivku?</div>${optionButtons(st.options,'shift-choose',a.selected,st.target+1)}<p class="muted">Graf naľavo sa mení podľa vášho rozhodnutia. Sivá krivka = pôvodná AD₀, farebná = nová AD₁.</p>`;}
 if(st.type==='graph'){const n=a.gcount||0,total=st.build.length;if(a.solvedGraph){inner=`<div class="feedback success">✅ Výkres je dokončený.</div><div class="question">Porovnajte graf s náčrtom svojho tímu:</div><div class="explain-strip">${esc(st.takeaway)}</div><div class="muted">Obrázok napravo/naľavo je finálne riešenie presne z podkladov k cvičeniu.</div>`;}else{const [question,options,correct]=st.build[n];inner=`<div class="card-progress">KRESLENIE · KROK ${n+1}/${total}</div>${pbar(n,total)}<div class="explain-strip">📈 ${esc(st.case)}</div><p class="question">${esc(question)}</p>${optionButtons(options,'graph-answer',a.selected,correct)}<p class="muted">Po každej správnej odpovedi sa na náčrte objaví ďalšia časť krivky. Finálny graf na porovnanie uvidíte po dokončení.</p>`;}}
 if(st.type==='policy'){inner=`<div class="explain-strip">📜 ${esc(st.case)}</div><p class="question">${esc(st.prompt)}</p><div class="options">${st.options.map((o,i)=>`<button class="policy-option" data-action="policy-select" data-val="${i}" ${a.policyChosen!==undefined?'disabled':''}><span class="policy-icon">${['🛠️','📉','⚖️'][i]}</span><span><strong>${esc(o.title)}</strong><small>${a.policyChosen===i?'Tím rozhodol o tomto opatrení.':'Kliknite a pozrite si jeho predpokladané účinky.'}</small></span></button>`).join('')}</div>`;
 if(a.policyChosen!==undefined){inner+=`<div class="feedback ${st.options[a.policyChosen].smart?'success':'info'}"><span>📊</span><div><b>Čo sa v hre zmenilo?</b>${esc(st.options[a.policyChosen].note)}<div style="margin-top:8px;font-weight:900">AD: ${st.options[a.policyChosen].ad>0?'môže rásť':st.options[a.policyChosen].ad<0?'môže klesať':'bez priamej zmeny'} · AS: ${st.options[a.policyChosen].as>0?'môže rásť':st.options[a.policyChosen].as<0?'môže klesať':'bez priamej zmeny'}</div></div></div>`;}}
 return `<div class="panel task-panel"><div class="task-top"><span class="task-type">${readType(st)}</span><span class="muted">Misia ${getChapter().num} / 07</span></div><h2 class="task-title">${esc(st.title)}</h2>${inner}${feedbackHtml()}${stepNextBtn()}</div>`;
}
function gameHtml(){const ch=getChapter(),st=getStep();return `<div class="game-head"><div><div class="eyebrow">${ch.icon} ${esc(ch.name)} · odporúčaný čas ${ch.minutes} min</div><h2>${esc(ch.short)}</h2><p>👥 ${esc(state.team)} · nájdite spoločné riešenie, až potom kliknite.</p>${pbar(state.step,ch.steps.length)}</div><div class="stepcount">${state.step+1} / ${ch.steps.length} etáp</div></div><div class="play-grid">${sceneHtml(st)}${taskHtml(st)}</div><div style="margin-top:15px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><button class="btn btn-outline btn-small" data-action="map">← Pozrieť mapu</button><span class="muted">💚 Za chyby neprichádzate o XP · nápovedy sú súčasť učenia.</span></div>`}
function chapterSuccess(){const ch=CHAPTERS[state.chapter];return `<div class="hero"><div class="panel"><div class="eyebrow">MISIA ${ch.num} UKONČENÁ</div><h2 class="title">${ch.icon} Nové miesto odomknuté!</h2><p class="subtitle">${esc(state.team)}, máte za sebou <b>${esc(ch.name)}</b>.</p><div class="explain-strip">🔓 <strong>Odomkli ste:</strong> ${esc(ch.unlock)}<br>⭐ Za dokončenie misie získavate XP.</div><p><b>Viete vysvetliť:</b></p><ul>${ch.learn.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="btn btn-primary" data-action="continue-map">${state.done.length===7?'🏆 Pozrieť finále':'🗺️ Vyraziť na ďalšiu misiu'} →</button></div><div class="city-frame">${citySvg()}<span class="city-credit">Nová štvrť Turistánie</span></div></div>`}
function completeHtml(){return `<div class="certificate"><div class="medal">🏆</div><div class="eyebrow">ZÁVEREČNÉ OCENENIE</div><h2>MAKRO MANAŽÉRI TURISTÁNIE</h2><h3 style="font-size:24px;color:#8a6a3a;margin:4px 0">${esc(state.team)}</h3><p>Dokončili ste všetkých 7 misií a úspešne sa orientujete v agregátnom dopyte, ponuke a makroekonomickej rovnováhe.</p><div style="font-size:19px;font-weight:900;color:#0b8c77">⭐ ${state.xp} skúsenostných bodov</div><div class="summary-grid"><div><strong>AD = C + I + G + NX</strong><p>Domácnosti, investície firiem, verejné nákupy a čistý export.</p></div><div><strong>AS = produkčné možnosti</strong><p>Náklady, technológia, práca, kapacita a produktivita.</p></div><div><strong>E = AD ∩ AS</strong><p>Rovnovážna cenová hladina Pₑ a produkt Yₑ.</p></div><div><strong>Čas rozhoduje</strong><p>Klasici, Keynes a monetaristi vidia reakcie rozdielne.</p></div></div><p style="margin-top:25px">💬 <b>Posledná otázka pre váš tím:</b> Čo sa stane s turizmom a zamestnanosťou, keď klesne AD a zároveň výrazne stúpnu náklady hotelov?</p><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:23px"><button class="btn btn-primary" data-action="map">🗺️ Pozrieť mapu</button><button class="btn btn-gold" data-action="print">🖨️ Vytlačiť ocenenie</button></div><p class="smallprint">Lokálne hranie · neodosielajú sa žiadne odpovede ani osobné údaje.</p></div>`}
function render(){updateToolbar();let html=state.phase==='welcome'?welcome():state.phase==='map'?mapHtml():state.phase==='game'?gameHtml():state.phase==='chapterDone'?chapterSuccess():completeHtml();root.innerHTML=html;document.querySelectorAll('[data-open-chapter]').forEach(n=>{n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openChapter(+n.dataset.openChapter)}})});save();}
function openChapter(i){if(state.phase==='welcome'||!Number.isInteger(i)||i<0||i>=7)return;if(i>0&&!state.done.includes(i-1))return;state.chapter=i;state.step=state.done.includes(i)?0:(state.checkpoints[i]||0);state.phase='game';state.activity={};render();}
function correct({title='Výborne!',text='',next=true,key,points=18}={}){state.activity.feedback={kind:'success',title,text};state.activity.ready=next;if(key)award(key,points);render();}
function retry(title,text){state.errors++;state.activity.feedback={kind:'try',title,text};render();}
function doneStep(){if(!state.activity.ready)return;const chapter=CHAPTERS[state.chapter];if(state.step+1<chapter.steps.length){state.step++;state.checkpoints[state.chapter]=state.step;state.activity={};state.phase='game';render();window.scrollTo({top:0,behavior:'smooth'});}else{let wasDone=state.done.includes(state.chapter);if(!wasDone){state.done.push(state.chapter);award('chapter-'+state.chapter,55);}state.phase='chapterDone';state.activity={};render();window.scrollTo({top:0,behavior:'smooth'});}}
function policyEffect(o){for(const k of ['tour','jobs','prices'])state.trends[k]=uiStat((state.trends[k]||50)+(o.impact[k]||0)*9);}
function clickAction(action,val){if(action==='start'){const input=document.getElementById('team-input');state.team=(input?.value||'Tím Turistánie').trim().slice(0,40)||'Tím Turistánie';state.phase='map';save();render();return;}
 if(action==='map'){state.phase='map';render();return;} if(action==='certificate'){state.phase='complete';render();return;}
 if(action==='print'){window.print();return;}
 if(action==='teacher'){showModal('teacher');return;}
 if(action==='help'){showModal('help');return;}
 if(action==='reset-ask'){showModal('reset');return;}
 if(action==='reset-confirm'){state=fresh();try{localStorage.removeItem(STORAGE_KEY)}catch(e){}modal.innerHTML='';render();return;}
 if(action==='close-modal'){modal.innerHTML='';return;}
 if(action==='continue-map'){state.phase=state.done.length===7?'complete':'map';render();return;}
 if(state.phase!=='game')return;
 const s=getStep(),a=state.activity,key=`${state.chapter}-${state.step}`;
 if(action==='next'){doneStep();return;}
 if(action==='story-done'){correct({title:'Tím je pripravený.',text:'Skúste si túto vetu povedať vlastnými slovami. V ďalšej etape ju využijete.',key});return;}
 if(action==='choose'&&s.type==='choice'){a.selected=val;if(val===s.correct){correct({title:'Správna ekonomická logika!',text:s.why,key});}else retry('Zatiaľ nie. Skúste to znova.',s.memory||'Premyslite si, či sa menia výdavky alebo schopnosť výroby.');return;}
 if(action==='sort-answer'&&s.type==='sort'){const item=s.items[a.sortIndex||0];let correctOpt=item.answer===-1?s.tags.length:item.answer;a.selectedSort=val;if(val===correctOpt){a.sortCleared=true;a.selectedSortCorrect=correctOpt;a.feedback={kind:'success',title:'Správne zaradené!',text:item.why};award('sort-'+key+'-'+(a.sortIndex||0),12);render();}else retry('Skontrolujte, kto nakupuje.',item.answer===-1?'Táto položka nepredstavuje priamy nákup G.':'Zamyslite sa, či nakupuje domácnosť, podnik, verejná správa, alebo zahraničie.');return;}
 if(action==='sort-next'&&s.type==='sort'){a.sortIndex=(a.sortIndex||0)+1;a.selectedSort=undefined;a.selectedSortCorrect=undefined;a.sortCleared=false;a.feedback=null;if(a.sortIndex>=s.items.length){a.ready=true;a.feedback={kind:'success',title:'Všetky správy roztriedené!',text:s.tip};award(key,25);}render();return;}
 if(action==='shift-choose'&&s.type==='shift'){a.selected=val;a.shiftDelta=val-1;if(val===s.target+1){correct({title:'Krivka sa posunula!',text:s.why,key});}else retry('Pozrite sa na príjmy krajiny.',s.memory+' Skúste presunúť krivku ešte raz.');return;}
 if(action==='graph-answer'&&s.type==='graph'){let n=a.gcount||0,question=s.build[n],good=question[2];a.selected=val;if(val===good){a.gcount=n+1;a.selected=undefined;a.feedback={kind:'success',title:'Ďalšia časť grafu hotová!',text:question[3]};award('graph-'+key+'-'+n,12);if(a.gcount>=s.build.length){a.ready=true;a.solvedGraph=true;a.feedback={kind:'success',title:'Celý graf je hotový!',text:s.takeaway};award(key,25);}render();}else retry('Krivku zatiaľ nekreslíme týmto smerom.',GRAPHS_META[s.graph].hint);return;}
 if(action==='policy-select'&&s.type==='policy'){if(a.policyChosen!==undefined)return;const o=s.options[val];if(!o)return;a.policyChosen=val;a.ready=true;policyEffect(o);a.feedback={kind:o.smart?'success':'info',title:o.smart?'Premyslené rozhodnutie!':'Pozrime sa na následky...',text:o.note};award(key,o.smart?35:18);render();return;}
}
function showModal(type){let h='';if(type==='help'){h=`<h2>🎮 Ako hrať Macro Tycoon</h2><p><b>Hrajte v tímoch po 2–3 študentoch na jednom zariadení.</b> Pri každom rozhodnutí sa najskôr krátko poraďte. Jeden číta situáciu, druhý vysvetlí príčinu a tretí vyhodnotí graf.</p><ul><li><b>7 lokalít:</b> každá sa sprístupní po dokončení predchádzajúcej.</li><li><b>Karty:</b> klikajte na kategóriu, do ktorej situácia patrí.</li><li><b>Grafy:</b> postupne ich skladáte a potom porovnáte s riešením z praktika.</li><li><b>Chyby:</b> nič sa nestrháva; vždy dostanete nápovedu.</li><li><b>Ovládanie:</b> funguje myšou, dotykom a väčšina tlačidiel aj klávesnicou.</li></ul><p><b>Ukladanie:</b> postup sa ukladá výlučne v tomto prehliadači a možno ho vymazať cez „Začať odznova“. Hra neobsahuje analytiku, MS Forms ani odosielanie odpovedí.</p>`}
 if(type==='teacher'){h=`<h2>👩‍🏫 Metodický režim vyučujúcej</h2><p><b>Cieľ:</b> hravo zopakovať model AD–AS z kapitoly 3 študijnej opory a z prezentácie „Cvičenie 3 – AD–AS, manažment v turizme“.</p><p><b>Organizácia:</b> skupiny 2–3. Odporúčané celkové trvanie <b>60–70 minút hry</b> + 10–15 minút spoločné uzavretie. Nie je potrebné prihlasovanie ani zbieranie výsledkov.</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:11px">${CHAPTERS.map(c=>`<div style="border-radius:12px;background:#f1f8f4;padding:12px"><b>${c.num} ${esc(c.name)}</b><br><small>${c.minutes} min · ${c.learn.map(esc).join('; ')}</small></div>`).join('')}</div><p><b>Grafy z praktika:</b> 1; 2a; 2b; 3; 4; 5; 7; 8 (klasici, Keynes, monetaristi); 9a; 9b. Úloha 6, neokeynesovská časť 8 a úloha 10 sa tu nekreslia – podľa zadania vyučujúcej.</p><p><b>Odborná poznámka:</b> pri súčasnom posune AD aj AS (vyššie dane, minimálna mzda) nemusí byť výsledná cenová hladina jednoznačná. Pri minimálnej mzde je zvýšenie AD len možný účinok, nie zákonitosť. Herné indexy nie sú skutočným HDP ani empirickou prognózou.</p><p><b>Na konci:</b> nech tímy jednou vetou vysvetlia rozdiel AD–AS a predvedú jeden graf, ktorý im na začiatku nebol jasný. 20 testových otázok z praktika nie je súčasťou hry.</p><p><b>Zdroje učiva:</b> dodaná kap. 3 „Makroekonomická rovnováha v modeli AD–AS“ (s. 37–49), prezentácia Cvičenie 3 a dodané ručné grafické riešenia.</p>`}
 if(type==='reset'){h=`<h2>↺ Začať odznova?</h2><p>Tým sa vymaže iba postup uložený v tomto prehliadači. Žiadne výsledky neboli nikam odoslané.</p><div style="display:flex;gap:12px"><button class="btn btn-outline" data-action="close-modal">Ponechať postup</button><button class="btn btn-primary" data-action="reset-confirm">Áno, nová hra</button></div>`}
 modal.innerHTML=`<div class="modal-layer" data-close-outside="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${type==='teacher'?'Metodický režim':'Informácie o hre'}"><button class="close" data-action="close-modal" aria-label="Zavrieť">×</button>${h}</section></div>`;
}
document.addEventListener('click',e=>{const m=e.target.closest('[data-action]');if(m){e.preventDefault();clickAction(m.dataset.action,m.dataset.val===undefined?null:Number(m.dataset.val));return;}const pin=e.target.closest('[data-open-chapter]');if(pin){e.preventDefault();openChapter(Number(pin.dataset.openChapter));return;}if(e.target.hasAttribute('data-close-outside'))modal.innerHTML='';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.innerHTML)modal.innerHTML='';if(e.key==='Enter'&&e.target.id==='team-input')clickAction('start',null);});
render();

</script>
</body></html>
